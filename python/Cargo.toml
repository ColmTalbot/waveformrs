[package]
name = "waveformrs-python"
version = "0.2.0"
edition = "2021"
description = "Python bindings of waveformrs"
license = "GPL-3.0-or-later"
publish = false

[lib]
# The Python package is `waveformrs`; the compiled module is
# `waveformrs._waveformrs` (see pyproject.toml), so that the library name does
# not clash with the `waveformrs` dependency.
name = "_waveformrs"
crate-type = ["cdylib"]

[dependencies]
waveformrs = { path = "..", version = "0.2.0" }
num-complex = "0.4"
numpy = "0.29"
# The stable ABI of Python 3.9 and later: one wheel per platform.
pyo3 = { version = "0.29", features = ["abi3-py39"] }

# As recommended for downstream crates of waveformrs (see ../Cargo.toml):
# whole-program optimisation recovers ~30% for IMRPhenomXAS.
[profile.release]
lto = "fat"
